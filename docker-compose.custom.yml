version: '3.8'

services:
  webrtc-server:
    image: nginx:alpine
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/custom.conf:/etc/nginx/conf.d/default.conf
      - ./webrtc-client:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl
    environment:
      - NGINX_HOST=0.0.0.0
      - NGINX_PORT=80
    restart: unless-stopped
